<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Graph Desmos-style equations and play them as sound." />
    <title>dmos — play equations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Stop the browser from navigating to a dropped .mid (blank white page).
      function blockFileNav(e) {
        if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault()
      }
      window.addEventListener('dragover', blockFileNav, true)
      window.addEventListener('drop', blockFileNav, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
